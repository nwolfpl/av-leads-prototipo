      <p class="note">${ico('info')}<span>Bloqueios valem independentemente da pontuação: não contatar, registro inválido ou empresa não ativa. Benefício já existente não bloqueia.</span></p>
      <p class="note">${ico('info')}<span>Rotatividade, convenção coletiva, contador e turnos são registrados sem pontuar. Os pesos deles serão decididos com os dados do piloto.</span></p>
      <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap"><button class="btn" id="wSave">Salvar como versão ${SCORE_VERSION+1} e recalcular</button><button class="btn sec" id="wReset">Restaurar padrão</button></div></div>
      <div class="card"><div class="card-head"><div><h3>Prévia ao vivo</h3><span class="hint">Fila de trabalho: as 10 primeiras ainda não qualificadas. Mexa nos pesos e veja a ordem mudar.</span></div></div><ol class="rank" id="rank"></ol></div></div>`;
    const top=()=>COMPANIES.map(c=>({c,s:score(c),o:oppOf(c)})).filter(x=>!x.s.block&&x.o&&x.o.maxStage<4&&!['perdido','nutricao'].includes(x.o.stage)).sort((a,b)=>b.s.total-a.s.total||a.c.nome.localeCompare(b.c.nome)).slice(0,10);
    const drawRank=()=>{const ol=$('#rank');const old={};$$('li',ol).forEach(li=>old[li.dataset.id]=li.getBoundingClientRect().top);const T=top();
      ol.innerHTML=T.map((x,i)=>`<li data-id="${x.c.id}"><span class="pos">${String(i+1).padStart(2,'0')}</span><span class="nm">${esc(x.c.nome)} <span class="muted" style="font-size:12px">· ${SEGS[x.c.seg].nome}</span></span><b>${x.s.total}</b></li>`).join('');
      if(reduced())return;$$('li',ol).forEach(li=>{const o=old[li.dataset.id];const n=li.getBoundingClientRect().top;if(o==null){li.animate([{opacity:0,transform:'translateX(18px)'},{opacity:1,transform:'none'}],{duration:380,easing:'cubic-bezier(.2,.8,.2,1)'})}else if(o!==n){li.animate([{transform:`translateY(${o-n}px)`},{transform:'none'}],{duration:450,easing:'cubic-bezier(.2,.8,.2,1)'})}})};
    const sum=()=>{const t=Object.values(W).reduce((a,b)=>a+b,0);$('#wSum').textContent=`soma ${t}`;$('#wSum').className='chip '+(t===100?'ok':'warn')};
    CRIT.forEach(([k])=>$('#w_'+k).oninput=e=>{W[k]=+e.target.value;$('#wv_'+k).textContent=W[k];sum();drawRank()});
    $('#wSave').onclick=()=>{SCORE_VERSION++;AUDIT.unshift({when:new Date(),who:'andre',what:'Regra de pontuação alterada',det:`Versão ${SCORE_VERSION}: `+CRIT.map(([k])=>`${k} ${W[k]}`).join(', ')});toast(`Versão ${SCORE_VERSION} salva. ${COMPANIES.length} empresas recalculadas.`);VIEWS.ajustes(v)};
    $('#wReset').onclick=()=>{W={...W_DEFAULT};VIEWS.ajustes(v)};
    sum();drawRank();
  }
  if(ADM==='sup'){const L=COMPANIES.filter(c=>c.supressao);
    b.innerHTML=`<div class="card" style="padding:6px 18px 12px"><div class="tbl-wrap"><table><thead><tr><th>Empresa</th><th>Escopo</th><th>Motivo</th><th>Desde</th><th>Autor</th><th></th></tr></thead><tbody>${L.map(c=>`<tr><td><b>${esc(c.nome)}</b><div class="muted mono" style="font-size:12px">${fmtCnpj(c.cnpj)}</div></td><td><span class="chip bad">${ico('lock')}${c.supressao.escopo==='telefone'?'Telefone '+esc(c.supressao.canal):'Empresa'}</span></td><td style="max-width:320px">${esc(c.supressao.motivo)}</td><td>${fDate(c.supressao.data)}</td><td>${TEAM[c.supressao.autor].nome}</td><td><button class="btn sec sm" data-open="${c.id}">Abrir ficha</button></td></tr>`).join('')}</tbody></table></div></div>
    <p class="note">${ico('lock')}<span>Bloqueios sobrevivem a reimportações e alterações cadastrais. A reativação exige fundamento e fica na auditoria.</span></p>`;
    b.onclick=e=>{const x=e.target.closest('[data-open]');if(x)openCompany(x.dataset.open)}}
  if(ADM==='parc'){
    const comCont=COMPANIES.filter(c=>c.qual.contador).length;
    b.innerHTML=`<div class="card" style="margin-bottom:14px;display:flex;gap:14px;align-items:center;flex-wrap:wrap"><div style="flex:1;min-width:220px"><b>Contadores como canal</b><div class="hint">O benchmark aponta o escritório contábil como possível porta de entrada nas PMEs. Hipótese a testar no piloto: comparar acesso ao decisor e prazo com a prospecção direta.</div></div><span class="chip info">${comCont} empresas com contador informado</span></div>
    <div class="card" style="padding:6px 18px 12px"><div class="tbl-wrap"><table><thead><tr><th>Parceiro</th><th>Tipo</th><th>Origem</th><th>Status</th><th class="r">Empresas ligadas</th><th class="r">Encaminhadas</th><th>Responsável</th></tr></thead><tbody>${PARTNERS.map(p=>`<tr><td><b>${esc(p.nome)}</b>${p.fone?`<div class="muted mono" style="font-size:12px">${esc(p.fone)}</div>`:''}</td><td>${esc(p.tipo)}</td><td>${esc(p.origem)}</td><td><span class="chip ${p.status==='Novo'?'':'info'}">${esc(p.status)}</span></td><td class="r num">${p.empresas}</td><td class="r num">${p.encaminhadas}</td><td><span style="display:flex;align-items:center;gap:8px"><span class="av sm" style="background:${TEAM[p.resp].cor}">${TEAM[p.resp].ini}</span>${TEAM[p.resp].nome}</span></td></tr>`).join('')}</tbody></table></div></div>
    <p class="note">${ico('info')}<span>Telefone compartilhado entre empresas sugere o escritório contábil. Abra uma das fichas com esse alerta para cadastrar o parceiro. Comissão só se for aprovada no futuro.</span></p>`}
  if(ADM==='cnae'){
    b.innerHTML=`<div class="block-banner warn">${ico('alert')}<div><b>Catálogo em validação.</b> Só 5611-2/03 e 8121-4/00 foram conferidos na classificação oficial (IBGE/CONCLA). Os demais precisam ser validados antes de lançar campanhas reais.</div></div>
    <div class="card" style="padding:6px 18px 12px"><div class="tbl-wrap"><table><thead><tr><th>Segmento</th><th>Prioridade</th><th>CNAE</th><th>Descrição</th><th>Status</th></tr></thead><tbody>${Object.entries(SEGS).map(([k,s])=>{const L=Object.entries(CNAES).filter(([,x])=>x.seg===k);return L.length?L.map(([code,x],i)=>`<tr><td>${i?'':`<span class="seg-tag"><i style="background:${s.cor}"></i>${s.nome}</span>`}</td><td>${i?'':s.ordem}</td><td class="mono">${code}</td><td>${esc(x.d)}</td><td>${x.st==='confirmado'?'<span class="chip ok">Conferido na fonte</span>':'<span class="chip warn">A validar</span>'}</td></tr>`).join(''):`<tr><td><span class="seg-tag"><i style="background:${s.cor}"></i>${s.nome}</span></td><td>${s.ordem}</td><td colspan="2" class="muted">Nenhum código cadastrado. Completar na fonte oficial.</td><td><span class="chip">Pendente</span></td></tr>`}).join('')}</tbody></table></div></div>`}
  if(ADM==='users'){
    b.innerHTML=`<div class="card" style="padding:6px 18px 12px"><div class="tbl-wrap"><table><thead><tr><th>Pessoa</th><th>Perfil</th><th>Acesso</th><th class="r">Empresas atribuídas</th></tr></thead><tbody>${Object.entries(TEAM).map(([k,t])=>`<tr><td><span style="display:flex;align-items:center;gap:10px"><span class="av sm" style="background:${t.cor}">${t.ini}</span>${t.nome}</span></td><td>${t.admin?'<span class="chip gold">Administrador</span>':'<span class="chip info">Comercial</span>'}</td><td class="muted">${t.admin?'Importações, exportações, usuários e regras':'Registros atribuídos ou compartilhados'}</td><td class="r num">${COMPANIES.filter(c=>c.resp===k).length}</td></tr>`).join('')}</tbody></table></div></div>`}
  if(ADM==='audit'){
    b.innerHTML=`<div class="card"><div class="tl">${AUDIT.slice().sort((a,b)=>b.when-a.when).slice(0,40).map(a=>`<div class="ev sys"><b>${esc(a.what)}</b><div class="meta">${TEAM[a.who].nome} · ${new Date(a.when).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}</div><p>${esc(a.det)}</p></div>`).join('')}</div></div>`}
};

/* ================= command palette ================= */
let palSel=0,palItems=[];
function openPal(){
  $('#palRoot').innerHTML=`<div class="palette" role="dialog" aria-label="Busca rápida"><div class="pbox"><input id="palIn" placeholder="Buscar empresa, CNPJ, bairro ou ação…" autocomplete="off"><div class="res" id="palRes"></div></div></div>`;
  const p=$('#palRoot .palette');p.onclick=e=>{if(e.target===p)closePal()};
  const inp=$('#palIn');inp.oninput=drawPal;inp.onkeydown=e=>{if(e.key==='ArrowDown'){palSel=Math.min(palSel+1,palItems.length-1);e.preventDefault();hlPal()}if(e.key==='ArrowUp'){palSel=Math.max(palSel-1,0);e.preventDefault();hlPal()}if(e.key==='Enter'&&palItems[palSel]){palItems[palSel].fn();closePal()}};
  drawPal();setTimeout(()=>inp.focus(),30);
}
function closePal(){$('#palRoot').innerHTML=''}
function drawPal(){
  const q=($('#palIn').value||'').toLowerCase().trim(),qd=q.replace(/\D/g,'');
  const cs=COMPANIES.filter(c=>!q||c.nome.toLowerCase().includes(q)||c.bairro.toLowerCase().includes(q)||c.cidade.toLowerCase().includes(q)||(qd.length>=3&&c.cnpj.includes(qd))).sort((a,b)=>score(b).total-score(a).total).slice(0,7);
  const acts=[['Abrir minha agenda',()=>location.hash='agenda'],['Ver pipeline',()=>location.hash='pipeline'],['Nova importação',()=>{IMP.step=1;IMP.runs=0;location.hash='importar'}],['Ajustar pesos da pontuação',()=>{ADM='score';location.hash='ajustes'}],['Alternar tema claro/escuro',toggleTheme]].filter(([l])=>!q||l.toLowerCase().includes(q));
  palItems=[...cs.map(c=>({fn:()=>openCompany(c.id),h:`<div class="av sm" style="background:${SEGS[c.seg].cor}">${score(c).block?'—':score(c).total}</div><div class="w"><b>${esc(c.nome)}</b><small>${fmtCnpj(c.cnpj)} · ${c.bairro}, ${c.cidade}</small></div>`})),...acts.map(([l,fn])=>({fn,h:`<div class="av sm" style="background:var(--surface-2);color:var(--muted)">${ico('flag')}</div><div class="w"><b>${l}</b></div>`}))];
  palSel=0;$('#palRes').innerHTML=(cs.length?'<div class="sec">Empresas</div>':'')+cs.map((c,i)=>`<div class="it" data-i="${i}">${palItems[i].h}</div>`).join('')+(acts.length?'<div class="sec">Ações</div>':'')+acts.map((a,j)=>`<div class="it" data-i="${cs.length+j}">${palItems[cs.length+j].h}</div>`).join('')+(palItems.length?'':'<div class="empty">Nada encontrado.</div>');
  $$('#palRes .it').forEach(el=>{el.onclick=()=>{palItems[+el.dataset.i].fn();closePal()};el.onmouseenter=()=>{palSel=+el.dataset.i;hlPal()}});hlPal();
}
function hlPal(){$$('#palRes .it').forEach(el=>el.classList.toggle('on',+el.dataset.i===palSel));const on=$('#palRes .it.on');on&&on.scrollIntoView({block:'nearest'})}
$('#openPal').onclick=openPal;$('#openPal2').onclick=openPal;

/* ================= theme ================= */
function toggleTheme(){const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.dataset.theme=dark?'light':'dark';try{localStorage.setItem('avleads-theme',r.dataset.theme)}catch(e){}}
try{const t=localStorage.getItem('avleads-theme');if(t)document.documentElement.dataset.theme=t}catch(e){}
$('#themeBtn').onclick=toggleTheme;

route();
</script>
