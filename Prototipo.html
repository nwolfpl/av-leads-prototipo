<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AV Leads</title>
<meta name="description" content="Protótipo de interface do AV Leads, sistema de prospecção e qualificação de empresas da Aurélia Vitalis. Dados fictícios.">
<meta name="theme-color" content="#123B5D">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: navy command rail on the left, bright working canvas on the right; on phones a bottom tab bar and one-column "today" flow. */
:root{
  --navy:#123B5D; --navy-2:#0D2C46; --blue:#2D9CDB; --gold:#C9A45C; --gold-ink:#8A6A2C;
  --bg:#F4F7F9; --surface:#FFFFFF; --surface-2:#EEF3F7; --ink:#0F2233; --muted:#5A6B7C; --line:#DCE4EB;
  --ok:#1C8F63; --ok-bg:#E3F4EC; --warn:#A86F0E; --warn-bg:#FBF0DA; --bad:#B9412F; --bad-bg:#FBE7E3; --info-bg:#E2F1FA;
  --rail:#123B5D; --rail-ink:#DCE8F2; --rail-muted:#8FA9C0;
  --shadow:0 1px 2px rgba(18,59,93,.06),0 8px 24px rgba(18,59,93,.08);
  --f-display:"Plus Jakarta Sans",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:12px; --r-sm:8px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A1622; --surface:#102236; --surface-2:#0D1D2E; --ink:#E5EDF4; --muted:#93A6B8; --line:#1F3650;
  --ok:#4CC99A; --ok-bg:#12352A; --warn:#E7B456; --warn-bg:#3A2D12; --bad:#F08A78; --bad-bg:#3D1C17; --info-bg:#11324A;
  --rail:#07121D; --rail-ink:#DCE8F2; --rail-muted:#7F97AD; --gold-ink:#D9B76F; --navy:#5FB4E6;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A1622; --surface:#102236; --surface-2:#0D1D2E; --ink:#E5EDF4; --muted:#93A6B8; --line:#1F3650;
  --ok:#4CC99A; --ok-bg:#12352A; --warn:#E7B456; --warn-bg:#3A2D12; --bad:#F08A78; --bad-bg:#3D1C17; --info-bg:#11324A;
  --rail:#07121D; --rail-ink:#DCE8F2; --rail-muted:#7F97AD; --gold-ink:#D9B76F; --navy:#5FB4E6;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
:root{padding-top:env(safe-area-inset-top,0px)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
svg:has(> use){width:1em;height:1em;flex:none;vertical-align:-.125em}
.pilot .p .warnline svg{width:13px;height:13px;margin-top:2px}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.mono{font-family:var(--f-mono);font-size:.92em;font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* ---------- app shell ---------- */
.app{display:grid;grid-template-columns:248px 1fr;min-height:100%}
.side{background:var(--rail);color:var(--rail-ink);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:22px 14px 16px;gap:22px;overflow:auto}
.brand{padding:0 10px;display:flex;flex-direction:column;gap:2px}
.brand .mark{font-family:var(--f-display);font-weight:800;font-size:19px;letter-spacing:-.02em;color:#fff;display:flex;align-items:center;gap:9px}
.brand .mark i{width:9px;height:9px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 4px rgba(201,164,92,.18)}
.brand small{color:var(--rail-muted);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;padding-left:18px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav .grp{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--rail-muted);padding:14px 12px 6px}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:9px;color:var(--rail-ink);text-decoration:none;font-weight:500;position:relative}
.nav a svg{width:18px;height:18px;opacity:.8;flex:none}
.nav a:hover{background:rgba(255,255,255,.06)}
.nav a.on{background:rgba(255,255,255,.1);color:#fff}
.nav a.on::before{content:"";position:absolute;left:-14px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--gold)}
.nav a .pill{margin-left:auto;background:var(--gold);color:#1d1606;font-size:11px;font-weight:700;border-radius:20px;padding:0 7px;line-height:18px}
.side .me{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;background:rgba(255,255,255,.05)}
.side .me b{display:block;color:#fff;font-weight:600}
.side .me span{font-size:12px;color:var(--rail-muted)}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:11.5px;font-weight:700;color:#fff;flex:none;background:var(--blue)}
.av.sm{width:24px;height:24px;font-size:10px}
.av.gold{background:var(--gold);color:#1d1606}

.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:12px;padding-block:12px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid transparent}
.top.scrolled{border-bottom-color:var(--line)}
.top .mbrand{display:none;font-family:var(--f-display);font-weight:800;font-size:17px;color:var(--ink);align-items:center;gap:8px}
.top .mbrand i{width:8px;height:8px;border-radius:50%;background:var(--gold)}
.search{flex:1;max-width:520px;display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;color:var(--muted);text-align:left}
.search svg{width:16px;height:16px}
.search kbd{margin-left:auto;font-family:var(--f-mono);font-size:11px;border:1px solid var(--line);border-radius:5px;padding:1px 6px;background:var(--surface-2)}
.demo{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--gold-ink);background:color-mix(in srgb,var(--gold) 16%,transparent);border:1px solid color-mix(in srgb,var(--gold) 40%,transparent);padding:4px 10px;border-radius:20px;white-space:nowrap}
.icon-btn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--muted)}
.icon-btn svg{width:17px;height:17px}
#view{padding-block:8px 48px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));min-width:0}
.tabbar{display:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}

/* ---------- generic ---------- */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:14px 0 20px}
.page-head h1{font-size:26px;font-weight:800}
.page-head p{margin:4px 0 0;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.card h3{font-size:15px;font-weight:700}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.grid{display:grid;gap:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;background:var(--navy);color:#fff;font-weight:600;border-radius:10px;padding:9px 14px;line-height:1.2;white-space:nowrap}
:root[data-theme="dark"] .btn:not(.sec):not(.ghost):not(.danger){color:#06121c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn:not(.sec):not(.ghost):not(.danger){color:#06121c}}
.btn svg{width:16px;height:16px}
.btn.sec{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn.ghost{background:transparent;color:var(--muted)}
.btn.gold{background:var(--gold);color:#1d1606!important}
.btn.danger{background:var(--bad-bg);color:var(--bad);border-color:color-mix(in srgb,var(--bad) 30%,transparent)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;border-radius:20px;padding:2px 9px;white-space:nowrap;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.chip.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.chip.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.chip.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.chip.info{background:var(--info-bg);color:var(--navy);border-color:transparent}
.chip.gold{background:color-mix(in srgb,var(--gold) 18%,transparent);color:var(--gold-ink);border-color:transparent}
.chip svg{width:12px;height:12px}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;background:currentColor}
.seg-tag{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500}
.seg-tag i{width:8px;height:8px;border-radius:2px;flex:none}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.field .lbl{font-size:12px;font-weight:600;color:var(--muted)}
.in{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:8px 10px;min-width:0}
.in:focus{border-color:var(--blue);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--blue) 20%,transparent)}
select.in{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 15px) 55%,calc(100% - 10px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:28px}
.hint{font-size:12px;color:var(--muted)}
.empty{padding:28px;text-align:center;color:var(--muted)}
.sembase{font-size:12px;font-weight:600;color:var(--muted);background:var(--surface-2);border:1px dashed var(--line);border-radius:6px;padding:1px 7px}

/* ---------- overview ---------- */
.hello{display:grid;grid-template-columns:1.35fr 1fr;gap:16px;margin:12px 0 16px}
.hero{position:relative;overflow:hidden;border-radius:16px;padding:24px 26px;color:#fff;background:radial-gradient(120% 140% at 100% 0%,#1f5a86 0%,#123B5D 48%,#0b2740 100%);min-width:0}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:260px;height:260px;border-radius:50%;border:1px solid rgba(201,164,92,.35);box-shadow:0 0 0 30px rgba(201,164,92,.06),0 0 0 62px rgba(201,164,92,.035)}
.hero .eyebrow{color:#9fc2dd}
.hero h1{font-size:30px;font-weight:800;margin:6px 0 6px;color:#fff}
.hero p{margin:0;color:#c8dbea;max-width:52ch}
.pilot{position:relative;z-index:1;display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:22px}
.pilot .p{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:12px}
.pilot .p b{display:block;font-family:var(--f-display);font-size:13px;color:#fff;font-weight:700}
.pilot .p .n{font-family:var(--f-display);font-size:22px;font-weight:800;color:#fff}
.pilot .p .n small{font-size:12px;color:#9fc2dd;font-weight:600}
.bar{height:6px;border-radius:6px;background:rgba(255,255,255,.14);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;width:0;border-radius:6px;background:linear-gradient(90deg,var(--blue),#7cc8f0);transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.pilot .p .warnline{font-size:11.5px;color:#f1d79f;margin-top:6px;display:flex;gap:5px;align-items:flex-start}
.today-card .t-item{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.today-card .t-item:first-of-type{border-top:0}
.today-card .t-item .w{flex:1;min-width:0}
.today-card .t-item b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0;position:relative;overflow:hidden}
.kpi .v{font-family:var(--f-display);font-size:28px;font-weight:800;letter-spacing:-.02em;margin-top:6px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--muted)}
.kpi svg.spark{position:absolute;right:12px;top:14px;width:70px;height:26px}
.two{display:grid;grid-template-columns:1.25fr 1fr;gap:16px;margin-bottom:16px}
.funnel{display:flex;flex-direction:column;gap:7px}
.f-row{display:grid;grid-template-columns:150px 1fr 74px;align-items:center;gap:12px}
.f-row .lab{font-size:13px;font-weight:500}
.f-track{height:30px;background:var(--surface-2);border-radius:8px;overflow:hidden;position:relative}
.f-fill{height:100%;width:0;border-radius:8px;background:linear-gradient(90deg,var(--navy),var(--blue));transition:width 1.2s cubic-bezier(.2,.8,.2,1);display:flex;align-items:center;padding-left:10px;color:#fff;font-weight:700;font-size:12.5px}
:root[data-theme="dark"] .f-fill{background:linear-gradient(90deg,#1d5f8f,var(--blue))}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .f-fill{background:linear-gradient(90deg,#1d5f8f,var(--blue))}}
.f-fill.win{background:linear-gradient(90deg,#b08a43,var(--gold));color:#1d1606}
.f-row .cv{font-size:12px;color:var(--muted);text-align:right}
.tbl-wrap{overflow-x:auto;margin:0 -18px;padding:0 18px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
.metric b{font-weight:700}
.metric small{display:block;font-size:11px;color:var(--muted)}
.lives-bars{display:flex;flex-direction:column;gap:12px}
.lb{display:grid;grid-template-columns:130px 1fr 90px;gap:10px;align-items:center;font-size:13px}
.lb .tr{height:10px;background:var(--surface-2);border-radius:10px;overflow:hidden}
.lb .tr i{display:block;height:100%;width:0;background:var(--gold);border-radius:10px;transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.note{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:flex-start;margin-top:12px}
.note svg{width:14px;height:14px;flex:none;margin-top:2px}

/* ---------- companies ---------- */
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-bottom:14px}
.filters .field{width:170px}
.filters .field.grow{flex:1;min-width:220px;width:auto}
.toggle{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);cursor:pointer;user-select:none;padding:8px 0}
.toggle input{accent-color:var(--navy);width:16px;height:16px}
.selbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--navy);color:#fff;border-radius:10px;padding:10px 14px;margin-bottom:12px;animation:pop .2s ease}
:root[data-theme="dark"] .selbar{background:#17405f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .selbar{background:#17405f}}
.selbar .btn.sec{background:rgba(255,255,255,.12);border-color:transparent;color:#fff}
.co-tbl tbody tr{cursor:pointer;transition:background .15s}
.co-tbl tbody tr:hover{background:var(--surface-2)}
.co-tbl tbody tr.blocked td{opacity:.62}
.co-tbl .nm{min-width:210px}
.co-tbl .nm b{display:block;font-weight:600}
.co-tbl .nm small{color:var(--muted);font-size:11.5px}
.sc{display:flex;align-items:center;gap:8px;min-width:112px}
.sc .meter{width:54px;height:6px;border-radius:6px;background:var(--surface-2);overflow:hidden}
.sc .meter i{display:block;height:100%;border-radius:6px;background:var(--blue)}
.sc b{width:24px;text-align:right;font-variant-numeric:tabular-nums}
.sc .miss{font-size:11px;color:var(--warn);font-weight:600}
.cnae-chip{font-family:var(--f-mono);font-size:11px;padding:1px 6px;border-radius:5px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.cnae-chip.sec{border-style:dashed}
.pager{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;flex-wrap:wrap}
.co-cards{display:none}
input[type=checkbox].ck{width:16px;height:16px;accent-color:var(--navy)}

/* ---------- drawer (ficha) ---------- */
.shade{position:fixed;inset:0;background:rgba(6,18,30,.45);backdrop-filter:blur(2px);z-index:60;opacity:0;pointer-events:none;transition:opacity .25s}
.shade.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(820px,100%);background:var(--bg);z-index:61;transform:translateX(102%);transition:transform .35s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;box-shadow:-20px 0 60px rgba(6,18,30,.25);padding-top:env(safe-area-inset-top,0px)}
.drawer.on{transform:none}
.d-head{padding:20px 24px 0;padding-right:max(24px,env(safe-area-inset-right,0px));background:var(--surface);border-bottom:1px solid var(--line)}
.d-top{display:flex;gap:14px;align-items:flex-start}
.d-top h2{font-size:22px;font-weight:800}
.d-top .sub{color:var(--muted);font-size:13px;margin-top:2px}
.d-badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.d-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.tabs{display:flex;gap:2px;margin-top:14px;overflow-x:auto}
.tabs button{border:0;background:transparent;padding:10px 12px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--ink);border-bottom-color:var(--gold)}
.d-body{flex:1;overflow:auto;padding:20px 24px 110px;padding-right:max(24px,env(safe-area-inset-right,0px))}
.d-grid{display:grid;grid-template-columns:270px 1fr;gap:16px}
.ring{position:relative;width:150px;height:150px;margin:4px auto 6px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:11}
.ring .bg{stroke:var(--surface-2)}
.ring .fg{stroke:url(#gradRing);stroke-linecap:round;transition:stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1)}
.ring .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .c b{font-family:var(--f-display);font-size:38px;font-weight:800;line-height:1}
.ring .c small{display:block;font-size:11px;color:var(--muted);margin-top:4px}
.comp{display:flex;flex-direction:column;gap:2px;margin-top:6px}
.comp .row{display:grid;grid-template-columns:18px 1fr auto;gap:8px;align-items:start;padding:7px 0;border-top:1px dashed var(--line);font-size:13px}
.comp .row:first-child{border-top:0}
.comp .row .ic{width:16px;height:16px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:800;margin-top:2px}
.comp .ok .ic{background:var(--ok-bg);color:var(--ok)}
.comp .no .ic{background:var(--surface-2);color:var(--muted)}
.comp .unknown .ic{background:var(--warn-bg);color:var(--warn)}
.comp .row small{display:block;color:var(--muted);font-size:11.5px}
.comp .pts{font-weight:700;font-variant-numeric:tabular-nums}
.comp .unknown .pts{color:var(--warn)}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 18px}
.kv div{min-width:0}
.kv dt{font-size:11.5px;color:var(--muted);font-weight:600;margin-bottom:2px}
.kv dd{margin:0;font-weight:500;overflow-wrap:anywhere}
.kv dd small{display:block;color:var(--muted);font-weight:400;font-size:11.5px}
.block-banner{display:flex;gap:10px;align-items:flex-start;background:var(--bad-bg);color:var(--bad);border-radius:10px;padding:12px 14px;margin-bottom:14px;font-size:13px}
.block-banner svg{width:18px;height:18px;flex:none;margin-top:1px}
.block-banner.warn{background:var(--warn-bg);color:var(--warn)}
.q{padding:14px 0;border-top:1px solid var(--line)}
.q:first-child{border-top:0;padding-top:0}
.q h4{font-family:var(--f-body);font-size:14px;font-weight:600;margin-bottom:9px}
.q h4 span{color:var(--muted);font-weight:500}
.tri{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.tri button{border:0;background:transparent;border-radius:7px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.tri button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.tri button.on.yes{color:var(--ok)}
.tri button.on.no{color:var(--bad)}
.tri button.on.unk{color:var(--warn)}
.qrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.progress{height:8px;border-radius:8px;background:var(--surface-2);overflow:hidden}
.progress i{display:block;height:100%;background:var(--gold);border-radius:8px;transition:width .5s ease}
.contact{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.contact:first-child{border-top:0}
.contact .ci{width:34px;height:34px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;color:var(--muted);flex:none}
.contact .ci svg{width:16px;height:16px}
.contact .w{flex:1;min-width:0}
.alert-inline{display:flex;gap:6px;align-items:flex-start;font-size:12px;color:var(--warn);margin-top:5px}
.alert-inline svg{width:13px;height:13px;flex:none;margin-top:2px}
.tl{position:relative;padding-left:26px}
.tl::before{content:"";position:absolute;left:9px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl .ev{position:relative;padding:0 0 18px}
.tl .ev::before{content:"";position:absolute;left:-22px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--muted)}
.tl .ev.conv::before{border-color:var(--ok);background:var(--ok)}
.tl .ev.try::before{border-color:var(--muted)}
.tl .ev.sys::before{border-color:var(--gold);background:var(--gold)}
.tl .ev b{font-weight:600}
.tl .ev .meta{font-size:12px;color:var(--muted)}
.tl .ev p{margin:4px 0 0;font-size:13px}
.d-mbar{display:none}

/* ---------- pipeline ---------- */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:262px;gap:12px;overflow-x:auto;padding-bottom:14px;align-items:start;min-height:60vh}
.col{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:200px;transition:background .15s,border-color .15s}
.col.over{background:color-mix(in srgb,var(--blue) 12%,var(--surface-2));border-color:var(--blue)}
.col.win.over{background:color-mix(in srgb,var(--gold) 18%,var(--surface-2));border-color:var(--gold)}
.col-h{display:flex;align-items:center;justify-content:space-between;padding:2px 4px 4px}
.col-h b{font-family:var(--f-display);font-size:13px}
.col-h span{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.col-sum{font-size:11.5px;color:var(--muted);padding:0 4px}
.opp{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 11px;cursor:grab;box-shadow:0 1px 1px rgba(0,0,0,.03);transition:transform .15s,box-shadow .15s}
.opp:hover{box-shadow:var(--shadow)}
.opp.dragging{opacity:.4;transform:rotate(1.5deg)}
.opp b{display:block;font-size:13.5px;font-weight:600;line-height:1.3}
.opp .l2{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:8px;font-size:12px;color:var(--muted)}
.opp .late{color:var(--bad);font-weight:600}
.opp.won{border-color:color-mix(in srgb,var(--gold) 55%,var(--line))}
.mv{font-size:12px;padding:4px 6px;border-radius:7px;border:1px solid var(--line);background:var(--surface-2);max-width:120px}
.stage-pills{display:none}

/* ---------- agenda ---------- */
.ag-group{margin-bottom:22px}
.ag-group h3{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;display:flex;gap:8px;align-items:center}
.ag-item{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.ag-item .when{font-family:var(--f-mono);font-size:12px;color:var(--muted);width:64px}
.ag-item .when.late{color:var(--bad);font-weight:600}
.ag-item .w{min-width:0;cursor:pointer}
.ag-item .w b{display:block;font-weight:600}
.ag-item .w span{font-size:12.5px;color:var(--muted)}
.ag-item .acts{display:flex;gap:6px}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px}
.quick .card{padding:14px}
.quick .v{font-family:var(--f-display);font-size:24px;font-weight:800}

/* ---------- import ---------- */
.steps{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap}
.steps .st{display:flex;align-items:center;gap:8px;padding:7px 12px;border-radius:20px;background:var(--surface);border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--muted)}
.steps .st i{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);font-style:normal;font-size:11px}
.steps .st.on{color:var(--ink);border-color:var(--navy)}
.steps .st.on i{background:var(--navy);color:#fff}
.steps .st.done i{background:var(--ok);color:#fff}
.drop{border:2px dashed var(--line);border-radius:14px;padding:38px 20px;text-align:center;background:var(--surface)}
.drop svg{width:40px;height:40px;color:var(--blue)}
.map-row{display:grid;grid-template-columns:1fr 24px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.map-row:first-child{border-top:0}
.counters{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:16px 0}
.counters .card{padding:14px;text-align:center}
.counters .v{font-family:var(--f-display);font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
.bigbar{height:12px;border-radius:12px;background:var(--surface-2);overflow:hidden}
.bigbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--navy),var(--blue));border-radius:12px;transition:width .2s linear}

/* ---------- campaigns ---------- */
.camps{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;margin-bottom:16px}
.camp .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.camp .stats div{background:var(--surface-2);border-radius:9px;padding:9px 10px}
.camp .stats b{display:block;font-family:var(--f-display);font-size:18px;font-weight:800}
.camp .stats span{font-size:11.5px;color:var(--muted)}
.effort{display:flex;flex-direction:column;gap:10px}

/* ---------- admin ---------- */
.adm{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.w-row{display:grid;grid-template-columns:1fr 150px 38px;gap:12px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.w-row:first-child{border-top:0}
.w-row input[type=range]{width:100%;accent-color:var(--navy)}
.w-row b{text-align:right;font-variant-numeric:tabular-nums}
.rank{list-style:none;margin:0;padding:0;position:relative}
.rank li{display:grid;grid-template-columns:26px 1fr 50px;gap:10px;align-items:center;padding:9px 10px;border-radius:9px;background:var(--surface);border:1px solid var(--line);margin-bottom:6px;will-change:transform}
.rank li .pos{font-family:var(--f-mono);color:var(--muted);font-size:12px}
.rank li b{font-variant-numeric:tabular-nums;text-align:right;font-family:var(--f-display);font-weight:800}
.rank li .nm{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.subtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.subtabs button{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:6px 14px;font-weight:600;color:var(--muted)}
.subtabs button.on{background:var(--navy);border-color:var(--navy);color:#fff}

/* ---------- modal / palette / toast ---------- */
.modal{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:16px;background:rgba(6,18,30,.5);backdrop-filter:blur(3px);animation:fade .2s}
.modal .box{width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto;background:var(--surface);border-radius:16px;box-shadow:0 30px 80px rgba(0,0,0,.35);animation:pop .22s cubic-bezier(.2,.8,.2,1)}
.modal .mh{padding:18px 20px 6px;display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.modal .mh h3{font-size:18px;font-weight:800}
.modal .mb{padding:10px 20px 6px;display:flex;flex-direction:column;gap:14px}
.modal .mf{padding:14px 20px 18px;display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.err{background:var(--bad-bg);color:var(--bad);border-radius:10px;padding:10px 12px;font-size:13px}
.err ul{margin:4px 0 0;padding-left:18px}
.choices{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.choice{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px;text-align:left;font-weight:600;font-size:13px;display:flex;flex-direction:column;gap:2px}
.choice small{font-weight:500;color:var(--muted);font-size:11.5px}
.choice.on{border-color:var(--navy);box-shadow:0 0 0 2px color-mix(in srgb,var(--navy) 25%,transparent)}
.choice.on.conv{border-color:var(--ok);box-shadow:0 0 0 2px color-mix(in srgb,var(--ok) 25%,transparent)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.palette{position:fixed;inset:0;z-index:90;background:rgba(6,18,30,.45);backdrop-filter:blur(3px);display:flex;justify-content:center;align-items:flex-start;padding:12vh 16px 16px;animation:fade .15s}
.palette .pbox{width:min(620px,100%);background:var(--surface);border-radius:14px;box-shadow:0 30px 80px rgba(0,0,0,.35);overflow:hidden;animation:pop .18s ease}
.palette input{width:100%;border:0;border-bottom:1px solid var(--line);padding:16px 18px;font-size:16px;background:transparent;outline:none}
.palette .res{max-height:52vh;overflow:auto;padding:6px}
.palette .it{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:9px;cursor:pointer}
.palette .it.on{background:var(--surface-2)}
.palette .it .w{flex:1;min-width:0}
.palette .it small{color:var(--muted);display:block;font-size:12px}
.palette .sec{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:10px 12px 4px}
#toasts{position:fixed;right:max(20px,env(safe-area-inset-right,0px));bottom:max(20px,env(safe-area-inset-bottom,0px));z-index:100;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.toast{background:var(--ink);color:var(--bg);padding:11px 15px;border-radius:11px;font-weight:500;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:slide .3s cubic-bezier(.2,.8,.2,1);max-width:360px;display:flex;gap:9px;align-items:flex-start}
.toast svg{width:16px;height:16px;flex:none;margin-top:2px;color:var(--gold)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:110}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}}
@keyframes slide{from{opacity:0;transform:translateY(12px)}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
.rise{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ---------- responsive ---------- */
@media (max-width:1180px){
  .kpis{grid-template-columns:repeat(3,1fr)}
  .hello,.two,.adm{grid-template-columns:1fr}
}
@media (max-width:900px){
  .d-grid{grid-template-columns:1fr}
  .quick{grid-template-columns:repeat(2,1fr)}
  .counters{grid-template-columns:repeat(3,1fr)}
}
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .top{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));gap:8px}
  .top .mbrand{display:flex}
  .top .search{display:none}
  .top .demo span{display:none}
  .top .spacer{flex:1}
  #view{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--surface);border-top:1px solid var(--line);padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
  .tabbar a,.tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);text-decoration:none;padding:6px 0;border:0;background:transparent;position:relative}
  .tabbar svg{width:22px;height:22px}
  .tabbar .on{color:var(--navy)}
  .tabbar .bdg{position:absolute;top:2px;left:calc(50% + 6px);background:var(--bad);color:#fff;border-radius:10px;font-size:10px;padding:0 5px;line-height:16px}
  .page-head h1{font-size:22px}
  .kpis{grid-template-columns:repeat(2,1fr);gap:10px}
  .kpi .v{font-size:22px}
  .kpi svg.spark{display:none}
  .hero{padding:20px}
  .hero h1{font-size:24px}
  .pilot{grid-template-columns:1fr;gap:8px}
  .f-row{grid-template-columns:104px 1fr 50px;gap:8px}
  .f-row .lab{font-size:12px}
  .lb{grid-template-columns:96px 1fr 70px}
  .filters{display:none}
  .filters.m-on{display:flex}
  .filters .field{width:calc(50% - 5px)}
  .co-desk{display:none}
  .co-cards{display:flex;flex-direction:column;gap:8px}
  .co-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:4px 10px}
  .co-card b{font-weight:600}
  .co-card .meta{font-size:12px;color:var(--muted)}
  .co-card .scb{grid-row:span 2;align-self:center;font-family:var(--f-display);font-weight:800;font-size:20px;text-align:right}
  .co-card .scb small{display:block;font-size:10px;color:var(--warn);font-weight:600;font-family:var(--f-body)}
  .board{display:none}
  .stage-pills{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px}
  .stage-pills button{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:6px 12px;font-weight:600;font-size:13px;white-space:nowrap;color:var(--muted)}
  .stage-pills button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
  .m-list{display:flex;flex-direction:column;gap:8px}
  .ag-item{grid-template-columns:1fr;gap:10px;padding:14px}
  .ag-item .when{width:auto}
  .ag-item .top-line{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .ag-item .acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .ag-item .acts .btn{padding:11px 10px}
  .quick{grid-template-columns:repeat(2,1fr);gap:10px}
  .drawer{width:100%}
  .d-head{padding:14px 16px 0}
  .d-top h2{font-size:19px}
  .d-actions{display:none}
  .d-body{padding:16px 16px calc(110px + env(safe-area-inset-bottom,0px))}
  .kv{grid-template-columns:1fr 1fr}
  .d-mbar{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;position:absolute;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px max(12px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
  .d-mbar .btn{padding:12px 8px;font-size:13px}
  .counters{grid-template-columns:repeat(2,1fr)}
  .map-row{grid-template-columns:1fr;gap:4px}
  .map-row .arrow{display:none}
  .row2{grid-template-columns:1fr}
  .w-row{grid-template-columns:1fr 110px 34px}
  .modal{align-items:end;padding:0}
  .modal .box{width:100%;border-radius:18px 18px 0 0;max-height:92vh;padding-bottom:env(safe-area-inset-bottom,0px)}
  #toasts{left:16px;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));align-items:stretch}
  .toast{max-width:none}
  .desk-only{display:none!important}
}
@media (min-width:761px){.m-only{display:none!important}}

const CRIT=[['seg','Segmento prioritário da campanha'],['regiao','Dentro da região-alvo'],['idade','Mais de 12 meses de atividade'],['contato','Contato comercial validado'],['equipe','Equipe de 10 a 49 confirmada'],['decisor','Decisor identificado e acessível'],['interesse','Interesse declarado em avaliar']];
const W_DEFAULT={seg:20,regiao:10,idade:10,contato:15,equipe:20,decisor:10,interesse:15};
let W={...W_DEFAULT}, SCORE_VERSION=3;
const monthsSince=d=>(TODAY-d)/(30.44*DAY);
function score(c){
  const q=c.qual,comps=[];const sumW=Object.values(W).reduce((a,b)=>a+b,0)||1;
  const add=(k,state,note)=>comps.push({k,label:CRIT.find(x=>x[0]===k)[1],state,note,pts:state==='ok'?W[k]:0});
  add('seg',SEGS[c.seg].piloto?'ok':'no',SEGS[c.seg].piloto?SEGS[c.seg].nome:'Fora das campanhas ativas');
  add('regiao',REGIAO.includes(c.cidade)?'ok':'no',c.cidade);
  const m=monthsSince(c.abertura);add('idade',m>=12?'ok':'no',m>=12?`Aberta em ${c.abertura.getFullYear()}`:`Aberta há ${Math.max(1,Math.round(m))} meses`);
  const val=c.contatos.some(x=>x.status==='validado');add('contato',val?'ok':'no',val?'Validado em conversa':'Só contato cadastral');
  if(q.func==null)add('equipe','unknown','Falta informação');
  else if(q.funcStatus!=='confirmado')add('equipe','unknown',`Estimativa de ${q.func}, falta confirmar`);
  else add('equipe',q.func>=10&&q.func<=49?'ok':'no',`Confirmado: ${q.func} pessoas`);
  add('decisor',q.decisor==null?'unknown':q.decisor?'ok':'no',q.decisor==null?'Falta informação':q.decisor?(q.decisorNome||'Identificado'):'Sem acesso ao decisor');
  add('interesse',q.interesse==null?'unknown':q.interesse==='sim'?'ok':'no',q.interesse==null?'Falta informação':q.interesse==='sim'?'Quer avaliar':'Sem interesse agora');
  const raw=comps.reduce((a,x)=>a+x.pts,0), total=Math.round(raw/sumW*100);
  const unknown=comps.filter(x=>x.state==='unknown').length;
  const block=c.supressao?.escopo==='empresa'?'Não contatar':c.situacao!=='ATIVA'?`Situação cadastral: ${c.situacao}`:null;
  const answered=[q.funcStatus==='confirmado',q.decisor!=null,q.beneficio!=null,q.interesse!=null,q.orcamento!=null].filter(Boolean).length;
  const ctx=[q.rotatividade!=null,q.cobre!=null,q.cct!=null,q.contador!=null,q.turnos!=null].filter(Boolean).length;
  return {total,comps,unknown,block,answered,ctx};
}

const coOf=o=>COMPANIES.find(c=>c.id===o.cid);

/* ================= metrics ================= */
function metrics(seg){
  const cs=COMPANIES.filter(c=>c.seg===seg);const os=cs.map(oppOf).filter(Boolean);
  const sel=cs.length, validated=cs.filter(c=>c.contatos.some(x=>x.status==='validado')).length;
  const worked=cs.filter(c=>c.acts.some(a=>a.kind!=='sys'||a.canal==='Pesquisa')).length;
  const conv=cs.filter(c=>c.acts.some(a=>a.kind==='conv')).length;
  const dec=cs.filter(c=>c.acts.some(a=>a.res==='Falou com o decisor')).length;
  const qual=os.filter(o=>o.maxStage>=4).length, prop=os.filter(o=>o.maxStage>=5).length;
  const won=os.filter(o=>o.stage==='ganho');
  const lives=won.reduce((a,o)=>a+o.lives,0), mrr=won.reduce((a,o)=>a+o.value,0);
  const hours=cs.reduce((a,c)=>a+c.acts.reduce((b,x)=>b+(x.min||0),0),0)/60;
  const days=won.map(o=>Math.round((o.wonAt-o.created)/DAY)).sort((a,b)=>a-b);
  const median=days.length?(days.length%2?days[(days.length-1)/2]:Math.round((days[days.length/2-1]+days[days.length/2])/2)):null;
  return {sel,validated,worked,conv,dec,qual,prop,won:won.length,lives,mrr,hours,median};
}

function countUp(el){
  const to=+el.dataset.count, fmt=el.dataset.fmt||'int';const f=v=>fmt==='brl'?brl(v):fmt==='pct'?Math.round(v)+'%':nf(Math.round(v));
  if(reduced()){el.textContent=f(to);return}
  const t0=performance.now(),dur=1100;const step=t=>{const p=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-p,3);el.textContent=f(to*e);if(p<1)requestAnimationFrame(step)};requestAnimationFrame(step);
}

  if(reduced())return;const cv=$('#confetti');cv.hidden=false;const ctx=cv.getContext('2d');const dpr=devicePixelRatio||1;cv.width=innerWidth*dpr;cv.height=innerHeight*dpr;ctx.scale(dpr,dpr);
  const cols=['#C9A45C','#E2C887','#2D9CDB','#123B5D','#ffffff'];const P=Array.from({length:150},()=>({x:innerWidth/2+(Math.random()-.5)*120,y:innerHeight*.42,vx:(Math.random()-.5)*13,vy:-Math.random()*13-4,s:Math.random()*7+4,r:Math.random()*6,vr:(Math.random()-.5)*.3,c:cols[Math.floor(Math.random()*cols.length)]}));
  const t0=performance.now();(function f(t){const el=t-t0;ctx.clearRect(0,0,innerWidth,innerHeight);P.forEach(p=>{p.vy+=.32;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.globalAlpha=Math.max(0,1-el/2200);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);ctx.restore()});if(el<2200)requestAnimationFrame(f);else{ctx.clearRect(0,0,innerWidth,innerHeight);cv.hidden=true}})(t0);
}

  <div class="page-head"><div><h1>Empresas</h1><p>Recorte da Receita Federal de ${fDate(COMPANIES[0].fonteData)} · ${COMPANIES.length} empresas · ${COMPANIES.reduce((a,c)=>a+1+c.filiais.length,0)} estabelecimentos</p></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn sec m-only" id="fToggle">${ico('filter')}Filtros</button><button class="btn sec desk-only" id="expBtn">${ico('dl')}Exportar CSV</button><a class="btn desk-only" href="#importar">${ico('up')}Importar</a></div></div>
  <div class="m-only" style="margin-bottom:10px"><input class="in" id="mq" placeholder="Buscar nome, CNPJ ou bairro" value="${esc(F.q)}"></div>
  <div class="filters" id="filters">
    <div class="field grow desk-only"><label for="fq">Busca</label><input class="in" id="fq" placeholder="Nome, razão social, CNPJ ou bairro" value="${esc(F.q)}"></div>
    <div class="field"><label for="fc">Cidade</label><select class="in" id="fc"><option value="">Todas</option>${[...REGIAO,'Nova Lima','Sete Lagoas'].map(x=>`<option ${F.cidade===x?'selected':''}>${x}</option>`).join('')}</select></div>
    <div class="field"><label for="fs">Segmento</label><select class="in" id="fs"><option value="">Todos</option>${Object.entries(SEGS).filter(([k])=>k!=='fabr').map(([k,s])=>`<option value="${k}" ${F.seg===k?'selected':''}>${s.nome}</option>`).join('')}</select></div>
    <div class="field"><label for="fcn">CNAE que motivou</label><select class="in" id="fcn"><option value="">Principal ou secundário</option><option value="pri" ${F.cnae==='pri'?'selected':''}>Só principal</option><option value="sec" ${F.cnae==='sec'?'selected':''}>Só secundário</option></select></div>
    <div class="field"><label for="fsi">Situação</label><select class="in" id="fsi"><option value="">Todas</option><option ${F.sit==='ATIVA'?'selected':''}>ATIVA</option><option value="nao" ${F.sit==='nao'?'selected':''}>Não ativa</option></select></div>
    <div class="field"><label for="fco">Contato</label><select class="in" id="fco"><option value="">Todos</option><option value="val" ${F.contato==='val'?'selected':''}>Validado</option><option value="cad" ${F.contato==='cad'?'selected':''}>Só cadastral</option></select></div>
    <div class="field"><label for="fmin">Pontuação mínima: <b id="fminv">${F.min}</b></label><input type="range" id="fmin" min="0" max="80" step="5" value="${F.min}" style="accent-color:var(--navy)"></div>
    <label class="toggle"><input type="checkbox" id="fb" ${F.bloq?'checked':''}>Mostrar bloqueadas</label>
  </div>
  <div id="selbar"></div>
  <div class="card co-desk" style="padding:6px 18px 12px"><div class="tbl-wrap"><table class="co-tbl"><thead><tr><th style="width:28px"><input type="checkbox" class="ck" id="ckAll" aria-label="Selecionar página"></th><th>Empresa</th><th>CNPJ</th><th>Segmento e CNAE</th><th>Situação</th><th>Contato</th><th>Pontuação</th><th>Resp.</th><th>Etapa</th></tr></thead><tbody id="coBody"></tbody></table></div><div class="pager" id="pager"></div></div>
  <div class="co-cards" id="coCards"></div>`;
  const bind=(id,k,fn=x=>x.value)=>{const el=$('#'+id);if(!el)return;el.addEventListener(el.type==='text'||el.type==='range'||el.tagName==='INPUT'&&el.type!=='checkbox'?'input':'change',()=>{F[k]=fn(el);F.page=0;if(k==='min')$('#fminv').textContent=F.min;drawList()})};
  bind('fq','q');bind('mq','q');bind('fc','cidade');bind('fs','seg');bind('fcn','cnae');bind('fsi','sit');bind('fco','contato');bind('fmin','min',x=>+x.value);bind('fb','bloq',x=>x.checked);
  $('#fToggle')&&($('#fToggle').onclick=()=>$('#filters').classList.toggle('m-on'));
  $('#expBtn').onclick=exportModal;
  $('#ckAll').onchange=e=>{pageRows.forEach(c=>e.target.checked?F.sel.add(c.id):F.sel.delete(c.id));drawList()};
  drawList();
};
let pageRows=[];
function filtered(){
  const q=F.q.trim().toLowerCase(),qd=q.replace(/\D/g,'');
  return COMPANIES.map(c=>({c,s:score(c),o:oppOf(c)})).filter(({c,s})=>
    (!q||c.nome.toLowerCase().includes(q)||c.razao.toLowerCase().includes(q)||c.bairro.toLowerCase().includes(q)||(qd.length>=4&&c.cnpj.includes(qd)))&&
    (!F.cidade||c.cidade===F.cidade)&&(!F.seg||c.seg===F.seg)&&(!F.cnae||(F.cnae==='sec'?c.viaSec:!c.viaSec))&&
    (!F.sit||(F.sit==='ATIVA'?c.situacao==='ATIVA':c.situacao!=='ATIVA'))&&
    (!F.contato||(F.contato==='val')===c.contatos.some(x=>x.status==='validado'))&&s.total>=F.min&&(F.bloq||!s.block)
  ).sort((a,b)=>(!!a.s.block-!!b.s.block)||b.s.total-a.s.total||a.c.nome.localeCompare(b.c.nome));
}
function cnaeCell(c){const code=c.viaSec?c.cnaeSec[0]:c.cnaePri;return `<span class="seg-tag"><i style="background:${SEGS[c.seg].cor}"></i>${SEGS[c.seg].nome}</span><div style="margin-top:3px"><span class="cnae-chip ${c.viaSec?'sec':''}" title="${esc(CNAES[code]?.d||'')}">${code} · ${c.viaSec?'secundário':'principal'}</span></div>`}
function sitChip(c){return c.situacao==='ATIVA'?'<span class="chip ok"><span class="dot"></span>Ativa</span>':`<span class="chip bad"><span class="dot"></span>${c.situacao[0]+c.situacao.slice(1).toLowerCase()}</span>`}
function contChip(c){if(c.supressao)return `<span class="chip bad">${ico('lock')}Não contatar</span>`;const v=c.contatos.some(x=>x.status==='validado');const sh=c.contatos.some(x=>x.valor===SHARED_PHONE);return v?'<span class="chip ok">Validado</span>':sh?'<span class="chip warn">Compartilhado</span>':'<span class="chip">Cadastral</span>'}
function scoreCell(s){if(s.block)return `<span class="chip bad">${ico('lock')}Bloqueada</span>`;return `<div class="sc"><b>${s.total}</b><div class="meter"><i style="width:${s.total}%"></i></div>${s.unknown?`<span class="miss" title="Itens sem informação não pontuam">faltam ${s.unknown}</span>`:''}</div>`}
function drawList(){
  const L=filtered(),per=isMobile()?30:20,pages=Math.max(1,Math.ceil(L.length/per));F.page=Math.min(F.page,pages-1);
  const P=L.slice(F.page*per,(F.page+1)*per);pageRows=P.map(x=>x.c);
  $('#coBody').innerHTML=P.map(({c,s,o})=>`<tr data-id="${c.id}" class="${s.block?'blocked':''}"><td><input type="checkbox" class="ck" data-ck="${c.id}" ${F.sel.has(c.id)?'checked':''} aria-label="Selecionar ${esc(c.nome)}"></td><td class="nm"><b>${esc(c.nome)}</b><small>${c.bairro}, ${c.cidade}${c.filiais.length?` · ${c.filiais.length+1} estabelecimentos`:''}</small></td><td class="mono" style="white-space:nowrap">${fmtCnpj(c.cnpj)}</td><td>${cnaeCell(c)}</td><td>${sitChip(c)}</td><td>${contChip(c)}</td><td>${scoreCell(s)}</td><td>${c.resp?`<div class="av sm" title="${TEAM[c.resp].nome}" style="background:${TEAM[c.resp].cor}">${TEAM[c.resp].ini}</div>`:'<span class="muted">—</span>'}</td><td>${o?`<span class="chip ${o.stage==='ganho'?'gold':o.stage==='perdido'?'bad':''}">${SL[o.stage]}</span>`:'<span class="muted">—</span>'}</td></tr>`).join('')||`<tr><td colspan="9" class="empty">Nenhuma empresa com esses filtros.</td></tr>`;
  $('#coCards').innerHTML=P.map(({c,s,o})=>`<div class="co-card" data-id="${c.id}"><b>${esc(c.nome)}</b><div class="scb">${s.block?ico('lock'):s.total}${!s.block&&s.unknown?`<small>faltam ${s.unknown}</small>`:''}</div><div class="meta">${c.bairro}, ${c.cidade} · ${SEGS[c.seg].nome}</div><div style="grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;margin-top:4px">${contChip(c)}${o?`<span class="chip">${SL[o.stage]}</span>`:''}${c.situacao!=='ATIVA'?sitChip(c):''}</div></div>`).join('')||'<div class="empty">Nenhuma empresa encontrada.</div>';
  $('#pager').innerHTML=`<span class="muted">${L.length} empresas · página ${F.page+1} de ${pages}</span><div style="display:flex;gap:6px"><button class="btn sec sm" data-pg="-1" ${F.page?'':'disabled'}>Anterior</button><button class="btn sec sm" data-pg="1" ${F.page<pages-1?'':'disabled'}>Próxima</button></div>`;
  $$('[data-pg]').forEach(b=>b.onclick=()=>{F.page+=+b.dataset.pg;drawList();window.scrollTo({top:0,behavior:'smooth'})});
  $('#coBody').onclick=e=>{const ck=e.target.closest('[data-ck]');if(ck){ck.checked?F.sel.add(ck.dataset.ck):F.sel.delete(ck.dataset.ck);drawSel();return}const tr=e.target.closest('tr[data-id]');if(tr)openCompany(tr.dataset.id)};
  $('#coCards').onclick=e=>{const d=e.target.closest('[data-id]');if(d)openCompany(d.dataset.id)};
  drawSel();
}
function drawSel(){const n=F.sel.size,el=$('#selbar');if(!el)return;if(!n){el.innerHTML='';return}
  el.innerHTML=`<div class="selbar"><b>${n} selecionada${n>1?'s':''}</b><button class="btn sec sm" id="sAssign">${ico('user')}Atribuir responsável</button><button class="btn sec sm" id="sCamp">${ico('flag')}Adicionar à campanha</button><button class="btn ghost sm" id="sClr" style="margin-left:auto;color:#fff">Limpar</button></div>`;
  $('#sClr').onclick=()=>{F.sel.clear();drawList()};$('#sAssign').onclick=assignModal;$('#sCamp').onclick=()=>{toast(`${n} empresas adicionadas à campanha. Bloqueadas por "não contatar" ficaram de fora.`);F.sel.clear();drawList()}}
function assignModal(){
  const ids=[...F.sel],cs=ids.map(id=>COMPANIES.find(c=>c.id===id));
  modal({title:'Atribuir responsável',sub:`${ids.length} empresas selecionadas`,body:`<div class="field"><label for="aw">Para quem</label><select class="in" id="aw">${Object.entries(TEAM).filter(([k])=>k!=='andre').map(([k,t])=>`<option value="${k}">${t.nome}</option>`).join('')}</select></div><div id="aWarn"></div>`,
    onMount:m=>{const upd=()=>{const who=$('#aw',m).value,other=cs.filter(c=>c.resp&&c.resp!==who);$('#aWarn',m).innerHTML=other.length?`<div class="block-banner warn">${ico('alert')}<div><b>${other.length} já têm outro responsável</b> (${[...new Set(other.map(c=>TEAM[c.resp].nome))].join(', ')}). Confirmar faz a redistribuição e registra na auditoria.</div></div>`:''};$('#aw',m).onchange=upd;upd()},
    actions:[{l:'Cancelar',sec:true},{l:'Confirmar atribuição',fn:m=>{const who=$('#aw',m).value;cs.forEach(c=>{const from=c.resp;c.resp=who;const o=oppOf(c);if(o)o.resp=who;if(from&&from!==who)AUDIT.unshift({when:new Date(),who:'andre',what:'Redistribuição',det:`${c.nome}: ${TEAM[from].nome} → ${TEAM[who].nome}`})});AUDIT.unshift({when:new Date(),who:'andre',what:'Responsável atribuído',det:`${cs.length} empresas para ${TEAM[who].nome}`});toast(`${cs.length} empresas atribuídas a ${TEAM[who].nome}.`);F.sel.clear();drawList()}}]});
}
function exportModal(){
  const L=filtered().map(x=>x.c);const all=COMPANIES.filter(c=>L.includes(c)||F.bloq);const blocked=L.filter(c=>c.supressao),inact=L.filter(c=>c.situacao!=='ATIVA'&&!c.supressao);const ok=L.filter(c=>!c.supressao&&c.situacao==='ATIVA');
  modal({title:'Exportar para prospecção',sub:'A exportação respeita "não contatar" e fica registrada na auditoria.',body:`
    <div class="kv"><div><dt>No filtro atual</dt><dd class="num">${L.length} empresas</dd></div><div><dt>Vão no arquivo</dt><dd class="num" style="color:var(--ok)">${ok.length} empresas</dd></div><div><dt>Removidas: não contatar</dt><dd class="num">${blocked.length}</dd></div><div><dt>Removidas: situação não ativa</dt><dd class="num">${inact.length}</dd></div></div>
    <div class="note" style="margin:0">${ico('lock')}<span>Valores que começam com = + - @ são neutralizados para não virarem fórmula na planilha.</span></div>
    <div class="field"><label for="exF">Finalidade (fica na auditoria)</label><input class="in" id="exF" value="Ligações da campanha Piloto BH"></div>`,
    actions:[{l:'Cancelar',sec:true},{l:'Gerar CSV',fn:m=>{const fin=$('#exF',m).value.trim();if(!fin){toast('Informe a finalidade da exportação.');return false}
      const safe=v=>{let s=String(v??'');if(/^[=+\-@\t\r]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'};
      const rows=[['cnpj','nome_fantasia','razao_social','cidade','segmento','cnae_motivo','telefone','status_contato','pontuacao','dados'],...ok.map(c=>[fmtCnpj(c.cnpj),c.nome,c.razao,c.cidade,SEGS[c.seg].nome,c.viaSec?c.cnaeSec[0]:c.cnaePri,c.contatos[0].valor,c.contatos[0].status,score(c).total,'FICTÍCIO'])];
      const csv='﻿'+rows.map(r=>r.map(safe).join(';')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='av-leads-exportacao-ficticia.csv';document.body.append(a);a.click();a.remove();
      AUDIT.unshift({when:new Date(),who:'andre',what:'Exportação CSV',det:`${ok.length} empresas · ${blocked.length+inact.length} bloqueadas removidas · finalidade: ${fin}`});toast(`Exportação gerada com ${ok.length} empresas e registrada na auditoria.`)}}]});
}

/* ---------- Ficha da empresa ---------- */
let DR={id:null,tab:'visao'};
function openCompany(id,tab='visao'){DR={id,tab};drawDrawer();$('#shade').classList.add('on');const d=$('#drawer');d.classList.add('on');d.setAttribute('aria-hidden','false');document.body.style.overflow='hidden'}
function closeDrawer(silent){const d=$('#drawer');if(!d.classList.contains('on'))return;d.classList.remove('on');d.setAttribute('aria-hidden','true');$('#shade').classList.remove('on');document.body.style.overflow='';DR.id=null}
$('#shade').onclick=()=>closeDrawer();
function drawDrawer(prevScore){
  const c=COMPANIES.find(x=>x.id===DR.id);if(!c)return;const s=score(c),o=oppOf(c);
  const tabs=[['visao','Visão'],['qual','Qualificação'],['cont','Contatos e evidências'],['tl','Linha do tempo']];
  $('#drawer').innerHTML=`
  <div class="d-head">
    <div class="d-top"><div style="flex:1;min-width:0"><div class="eyebrow">${SEGS[c.seg].full}</div><h2>${esc(c.nome)}</h2><div class="sub"><span class="mono">${fmtCnpj(c.cnpj)}</span> · ${esc(c.razao)}</div></div><button class="icon-btn" id="dClose" aria-label="Fechar ficha">${ico('x')}</button></div>
    <div class="d-badges">${sitChip(c)}${o?`<span class="chip ${o.stage==='ganho'?'gold':''}">${SL[o.stage]}</span>`:''}${c.resp?`<span class="chip"><span class="av sm" style="width:16px;height:16px;font-size:8px;background:${TEAM[c.resp].cor}">${TEAM[c.resp].ini}</span>${TEAM[c.resp].nome}</span>`:'<span class="chip warn">Sem responsável</span>'}${c.supressao?`<span class="chip bad">${ico('lock')}Não contatar${c.supressao.escopo==='telefone'?' por telefone':''}</span>`:''}<span class="chip gold">Fictícia</span></div>
    <div class="d-actions"><button class="btn" id="dAct" ${s.block?'disabled':''}>${ico('chat')}Registrar contato</button><button class="btn sec" id="dStage" ${!o?'disabled':''}>Mudar etapa</button>${c.supressao?'':`<button class="btn danger" id="dSup">${ico('lock')}Não contatar</button>`}</div>
    <div class="tabs" role="tablist">${tabs.map(([k,l])=>`<button role="tab" data-tab="${k}" class="${DR.tab===k?'on':''}">${l}</button>`).join('')}</div>
  </div>
  <div class="d-body" id="dBody"></div>
  <div class="d-mbar"><button class="btn sec" id="mTry" ${s.block?'disabled':''}>Não atendeu</button><button class="btn" id="mConv" ${s.block?'disabled':''}>Conversei</button><button class="btn sec" id="mQual">Qualificar</button></div>`;
  $('#dClose').onclick=()=>closeDrawer();
  $$('[data-tab]',$('#drawer')).forEach(b=>b.onclick=()=>{DR.tab=b.dataset.tab;drawDrawer()});
  $('#dAct').onclick=()=>activityModal(c.id,'conv');
  $('#dStage').onclick=()=>o&&stageModal(o);
  $('#dSup')&&($('#dSup').onclick=()=>suppressModal(c));
  $('#mTry').onclick=()=>{activityModal(c.id,'try')};$('#mConv').onclick=()=>activityModal(c.id,'conv');$('#mQual').onclick=()=>{DR.tab='qual';drawDrawer()};
  const b=$('#dBody');
  let banner=c.supressao?`<div class="block-banner">${ico('lock')}<div><b>Não contatar${c.supressao.escopo==='telefone'?' por telefone':''}</b> desde ${fDate(c.supressao.data)}, por ${TEAM[c.supressao.autor].nome}. Motivo: ${esc(c.supressao.motivo)}. Fica fora de exportações e eventos de contato, mesmo após nova importação.${TEAM.andre.admin?` <button class="btn sec sm" id="reactBtn" style="margin-left:6px">Reativar (admin)</button>`:''}</div></div>`:c.situacao!=='ATIVA'?`<div class="block-banner warn">${ico('alert')}<div><b>Situação cadastral ${c.situacao}.</b> A seleção automática para prospecção está suspensa. O histórico é preservado.</div></div>`:'';
  if(c.qual.cct===true&&!c.supressao)banner+=`<div class="block-banner warn">${ico('alert')}<div><b>A convenção coletiva exige benefício de saúde.</b> Telemedicina não substitui um plano exigido pela convenção. Use outro argumento (complemento ao plano, dependentes) ou registre a perda "Convenção coletiva exige plano".</div></div>`;
  if(DR.tab==='visao'){
    const C=2*Math.PI*62;
    b.innerHTML=`${banner}<div class="d-grid">
      <div class="card"><div class="card-head" style="margin-bottom:4px"><h3>Pontuação</h3><span class="chip">versão ${SCORE_VERSION}</span></div>
        <div class="ring"><svg viewBox="0 0 150 150"><circle class="bg" cx="75" cy="75" r="62"/><circle class="fg" id="ringFg" cx="75" cy="75" r="62" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-(prevScore??0)/100)}"/></svg><div class="c"><div><b id="ringN">${prevScore??0}</b><small>de 100</small></div></div></div>
        <p class="hint" style="text-align:center;margin:0 0 8px">Prioridade de trabalho, não chance de compra.</p>
        <div class="comp">${s.comps.map(x=>`<div class="row ${x.state}"><span class="ic">${x.state==='ok'?'✓':x.state==='unknown'?'?':'–'}</span><div>${x.label}<small>${esc(x.note)}</small></div><span class="pts">${x.state==='ok'?'+'+x.pts:x.state==='unknown'?'falta':'0'}</span></div>`).join('')}</div>
        ${s.unknown?`<div class="note">${ico('info')}<span>${s.unknown} ${s.unknown>1?'itens':'item'} sem informação não pontuam. Isso não é rejeição: falta conversar.</span></div>`:''}
      </div>
      <div class="grid" style="align-content:start">
        ${o&&o.next?`<div class="card" style="display:flex;gap:12px;align-items:center"><div class="ci" style="width:40px;height:40px;border-radius:12px;background:var(--info-bg);display:grid;place-items:center;color:var(--navy)">${ico('cal')}</div><div style="flex:1;min-width:0"><div class="eyebrow">Próxima ação · ${rel(o.next)}</div><b>${esc(o.nextTxt)}</b></div></div>`:''}
        ${o&&o.stage==='ganho'?`<div class="card" style="border-color:color-mix(in srgb,var(--gold) 50%,var(--line))"><div class="eyebrow">Contrato ganho em ${fDate(o.wonAt)}</div><div class="kv" style="margin-top:8px"><div><dt>Vidas contratadas</dt><dd>${o.lives}</dd></div><div><dt>Valor recorrente contratado</dt><dd>${brl(o.value)}<small>contratado, não recebido</small></dd></div><div><dt>Referência</dt><dd class="mono">${o.ref}</dd></div></div></div>`:''}
        <div class="card"><div class="card-head"><h3>Dados cadastrais</h3><span class="hint">Receita Federal · ${fDate(c.fonteData)}</span></div>
          <dl class="kv" style="margin:0">
            <div><dt>CNPJ raiz</dt><dd class="mono">${c.cnpjRoot.replace(/^(\d{2})(\d{3})(\d{3})$/,'$1.$2.$3')}</dd></div>
            <div><dt>Abertura</dt><dd>${fDate(c.abertura)}</dd></div>
            <div><dt>Natureza jurídica</dt><dd>${c.natureza}</dd></div>
            <div><dt>Porte</dt><dd>${c.porte}<small>não equivale a número de empregados</small></dd></div>
            <div><dt>Capital social</dt><dd>${brl(c.capital)}<small>não indica faturamento nem orçamento</small></dd></div>
            <div><dt>Simples / MEI</dt><dd>${c.simples?'Optante do Simples':'Não optante'} · ${c.mei?'MEI':'não MEI'}</dd></div>
            <div style="grid-column:1/-1"><dt>CNAE principal ${!c.viaSec?'<span class="chip info" style="margin-left:4px">motivou a seleção</span>':''}</dt><dd><span class="mono">${c.cnaePri}</span> ${esc(cnaeDesc(c.cnaePri))}</dd></div>
            ${c.cnaeSec.length?`<div style="grid-column:1/-1"><dt>CNAE secundário ${c.viaSec?'<span class="chip info" style="margin-left:4px">motivou a seleção</span>':''}</dt><dd>${c.cnaeSec.map(x=>`<span class="mono">${x}</span> ${esc(cnaeDesc(x))}`).join('<br>')}</dd></div>`:''}
            <div style="grid-column:1/-1"><dt>Endereço</dt><dd>${c.bairro}, ${c.cidade} – ${c.uf}</dd></div>
          </dl>
        </div>

/* ---------- activity / stage / suppression modals ---------- */
function activityModal(cid,mode='conv'){
  const c=COMPANIES.find(x=>x.id===cid),o=oppOf(c);if(score(c).block){toast('Empresa bloqueada para novo contato.');return}
  const RES=[['try','Não atendeu','Tentativa'],['try','Caixa postal','Tentativa'],['bad','Número errado','Tentativa'],['conv','Conversou com a empresa','Conversa efetiva'],['dec','Falou com o decisor','Conversa efetiva'],['nao','Sem interesse agora','Conversa efetiva']];
  let res=mode==='try'?0:3,canal='Ligação';
  modal({title:'Registrar contato',sub:esc(c.nome),body:`
    <div class="field"><span class="lbl">Canal</span><div class="tri" id="aC">${['Ligação','WhatsApp','Visita','E-mail'].map((x,i)=>`<button data-v="${x}" class="${i===0?'on':''}">${x}</button>`).join('')}</div></div>
    <div class="field"><span class="lbl">O que aconteceu</span><div class="choices" id="aR">${RES.map(([k,l,g],i)=>`<button class="choice ${i===res?'on':''} ${['conv','dec','nao'].includes(k)?'conv':''}" data-i="${i}">${l}<small>${g}</small></button>`).join('')}</div></div>
    <div class="row2"><div class="field"><label for="aMin">Duração (min)</label><input class="in" id="aMin" type="number" min="1" value="${mode==='try'?2:8}" inputmode="numeric"></div><div class="field"><label for="aNext">Próxima ação em</label><input class="in" id="aNext" type="date" value="${nextBiz(mode==='try'?1:3).toISOString().slice(0,10)}"></div></div>
    <div class="field"><label for="aTxt">Anotação</label><textarea class="in" id="aTxt" rows="2" placeholder="Ex.: falar com a Dona Célia depois das 15h"></textarea></div>
    <p class="hint" style="margin:0">Não registre sintomas, diagnósticos ou dados de saúde de ninguém.</p>`,
    onMount:m=>{$('#aC',m).onclick=e=>{const b=e.target.closest('button');if(!b)return;canal=b.dataset.v;$$('#aC button',m).forEach(x=>x.classList.toggle('on',x===b))};$('#aR',m).onclick=e=>{const b=e.target.closest('[data-i]');if(!b)return;res=+b.dataset.i;$$('#aR .choice',m).forEach(x=>x.classList.toggle('on',x===b));$('#aMin',m).value=res<3?2:8}},
    actions:[{l:'Cancelar',sec:true},{l:'Salvar registro',fn:m=>{
      const [k,l]=RES[res];const before=score(c).total;const min=+$('#aMin',m).value||1;const nd=$('#aNext',m).value;
      c.acts.push({kind:['conv','dec','nao'].includes(k)?'conv':'try',canal,res:l,min,txt:$('#aTxt',m).value.trim(),when:new Date(),author:'andre'});
      if(k==='bad'){c.contatos[0].status='inválido'}
      if(['conv','dec','nao'].includes(k)){c.contatos.forEach(x=>{if(x.tipo===(canal==='E-mail'?'E-mail':'Telefone')&&x.status!=='inválido')x.status='validado'})}
      if(k==='dec'){c.qual.decisor=true}
      if(k==='nao'){c.qual.interesse='nao'}
      if(o){if(k==='nao'){o.stage='nutricao';o.next=addDays(TODAY,90);o.nextTxt='Retomar contato no próximo trimestre'}else{if(['conv','dec'].includes(k)&&SI[o.stage]<3){o.stage='realizado';o.maxStage=Math.max(o.maxStage,3)}o.next=nd?new Date(nd+'T12:00'):nextBiz(2);o.nextTxt=k==='dec'?'Aprofundar qualificação com o decisor':k==='bad'?'Achar telefone correto':res<3?'Tentar de novo':NEXT_TXT[o.stage]||'Retornar'}}
      const after=score(c).total;
      toast(`${['conv','dec','nao'].includes(k)?'Conversa':'Tentativa'} registrada${after!==before?` · pontuação ${before} → ${after}`:''}.`);
      if(DR.id===c.id){drawDrawer(before)}
      if(current==='agenda'||current==='pipeline'){const keep=DR.id;VIEWS[current]($('#view'));animateIn($('#view'))}
      renderNav(current);
    }}]});
}
function stageModal(o){
  modal({title:'Mudar etapa',sub:esc(coOf(o).nome),body:`<div class="choices">${STAGES.map(([k,l])=>`<button class="choice ${o.stage===k?'on':''}" data-s="${k}">${l}</button>`).join('')}</div>`,actions:[{l:'Fechar',sec:true}],
    onMount:m=>$('.choices',m).onclick=e=>{const b=e.target.closest('[data-s]');if(!b)return;closeModal();setStage(o,b.dataset.s)}});
}
function setStage(o,st){
  const c=coOf(o);if(o.stage===st)return;
  if(score(c).block&&SI[st]>=2&&st!=='perdido'){toast('Empresa com bloqueio ativo não avança para etapas de contato.');return}
  if(st==='ganho')return wonModal(o);
  if(st==='perdido')return lossModal(o);
  const from=o.stage;o.stage=st;o.maxStage=Math.max(o.maxStage,SI[st]<7?SI[st]:o.maxStage);o.nextTxt=NEXT_TXT[st]||o.nextTxt;if(!o.next)o.next=nextBiz(2);
  AUDIT.unshift({when:new Date(),who:'andre',what:'Etapa alterada',det:`${c.nome}: ${SL[from]} → ${SL[st]}`});
  toast(`${esc(c.nome)} movida para ${SL[st]}.`);refreshAfterStage();
}
function refreshAfterStage(){if(DR.id)drawDrawer();if(current==='pipeline'||current==='visao'){VIEWS[current]($('#view'));animateIn($('#view'))}renderNav(current)}
function wonModal(o){const c=coOf(o);
  modal({title:'Registrar ganho',sub:`${esc(c.nome)} · os valores são contratados, não recebidos`,body:`
    <div id="wErr"></div>
    <div class="row2"><div class="field"><label for="wL">Vidas contratadas</label><input class="in" id="wL" type="number" min="1" inputmode="numeric" placeholder="Ex.: 18" value="${c.qual.func??''}"></div><div class="field"><label for="wV">Valor recorrente mensal (R$)</label><input class="in" id="wV" inputmode="decimal" placeholder="Conforme a proposta aprovada"></div></div>
    <div class="row2"><div class="field"><label for="wR">Referência do contrato</label><input class="in" id="wR" placeholder="Ex.: AV-2026-031"></div><div class="field"><label for="wD">Data do ganho</label><input class="in" id="wD" type="date" value="${TODAY.toISOString().slice(0,10)}"></div></div>
    <p class="hint" style="margin:0">O sistema não sugere preço: o valor vem da proposta aprovada na oferta vigente.</p>`,
    actions:[{l:'Cancelar',sec:true},{l:'Confirmar ganho',cls:'gold',fn:m=>{
      const L=parseInt($('#wL',m).value),V=Math.round(parseFloat(($('#wV',m).value||'').replace(/\./g,'').replace(',','.'))*100),Rf=$('#wR',m).value.trim(),D=$('#wD',m).value;const errs=[];
      if(!(L>0))errs.push('quantidade de vidas contratadas');if(!(V>0))errs.push('valor recorrente contratado');if(!Rf)errs.push('referência do contrato');if(!D)errs.push('data do ganho');
      if(errs.length){$('#wErr',m).innerHTML=`<div class="err"><b>Ganho recusado.</b> Falta preencher:<ul>${errs.map(e=>`<li>${e}</li>`).join('')}</ul></div>`;$('#wErr',m).firstElementChild.animate([{transform:'translateX(-6px)'},{transform:'translateX(6px)'},{transform:'translateX(0)'}],{duration:260});return false}
      o.stage='ganho';o.maxStage=7;o.lives=L;o.value=V;o.ref=Rf;o.wonAt=new Date(D+'T12:00');o.next=null;
      c.acts.push({kind:'sys',canal:'Contrato',res:`Ganho · ${L} vidas`,min:15,txt:`Contrato ${Rf} registrado.`,when:new Date(),author:'andre'});
      AUDIT.unshift({when:new Date(),who:'andre',what:'Oportunidade ganha',det:`${c.nome} · ${L} vidas · ${brl(V)}/mês · ${Rf}`});
      confetti();toast(`Contrato ganho: ${L} vidas para ${esc(c.nome)}.`);refreshAfterStage();
    }}]});
}

/* ---------- Pipeline ---------- */
let PF={who:'',mStage:'validado'};
VIEWS.pipeline=v=>{
  const opps=OPPS.filter(o=>!PF.who||o.resp===PF.who);
  const cols=STAGES;
  const card=o=>{const c=coOf(o),s=score(c),d=o.next?dayDiff(o.next):null;return `<div class="opp ${o.stage==='ganho'?'won':''}" draggable="true" data-o="${o.id}"><b>${esc(c.nome)}</b><div class="l2"><span class="seg-tag"><i style="background:${SEGS[c.seg].cor}"></i>${c.cidade}</span><span class="num">${s.block?ico('lock'):s.total+' pts'}</span></div><div class="l2">${o.stage==='ganho'?`<span style="color:var(--gold-ink);font-weight:700">${o.lives} vidas · ${brl(o.value)}</span>`:o.stage==='perdido'?`<span>${esc(o.loss)}</span>`:`<span class="${d<0?'late':''}">${d==null?'':d<0?rel(o.next):fShort(o.next)}</span>`}<span style="display:flex;gap:6px;align-items:center"><select class="mv" data-mv="${o.id}" aria-label="Mover ${esc(c.nome)} para outra etapa">${cols.map(([k,l])=>`<option value="${k}" ${k===o.stage?'selected':''}>${l}</option>`).join('')}</select>${o.resp?`<span class="av sm" style="background:${TEAM[o.resp].cor}">${TEAM[o.resp].ini}</span>`:''}</span></div></div>`};
  v.innerHTML=`
  <div class="page-head"><div><h1>Pipeline</h1><p>Arraste os cartões ou use o seletor de etapa. Ganho exige vidas, valor e contrato.</p></div>
    <div class="tri" id="pWho"><button data-v="" class="${PF.who===''?'on':''}">Todos</button>${['ana','bruno','carla'].map(k=>`<button data-v="${k}" class="${PF.who===k?'on':''}">${TEAM[k].nome.split(' ')[0]}</button>`).join('')}</div></div>
  <div class="board" id="board">${cols.map(([k,l])=>{const L=opps.filter(o=>o.stage===k);const sum=k==='ganho'?`${L.reduce((a,o)=>a+o.lives,0)} vidas · ${brl(L.reduce((a,o)=>a+o.value,0))}/mês`:'';return `<div class="col ${k==='ganho'?'win':''}" data-col="${k}"><div class="col-h"><b>${l}</b><span>${L.length}</span></div>${sum?`<div class="col-sum">${sum}</div>`:''}${L.sort((a,b)=>(a.next||0)-(b.next||0)).slice(0,40).map(card).join('')}</div>`}).join('')}</div>
  <div class="stage-pills" id="sp">${cols.map(([k,l])=>`<button data-st="${k}" class="${PF.mStage===k?'on':''}">${l} · ${opps.filter(o=>o.stage===k).length}</button>`).join('')}</div>
  <div class="m-list m-only">${opps.filter(o=>o.stage===PF.mStage).map(card).join('')||'<div class="empty">Nenhuma oportunidade nesta etapa.</div>'}</div>`;
  $('#pWho').onclick=e=>{const b=e.target.closest('button');if(!b)return;PF.who=b.dataset.v;VIEWS.pipeline(v)};
  $('#sp').onclick=e=>{const b=e.target.closest('[data-st]');if(!b)return;PF.mStage=b.dataset.st;VIEWS.pipeline(v)};
  v.onchange=e=>{const s=e.target.closest('[data-mv]');if(s){setStage(OPPS.find(o=>o.id===s.dataset.mv),s.value)}};
  v.onclick=e=>{if(e.target.closest('select'))return;const c=e.target.closest('[data-o]');if(c)openCompany(OPPS.find(o=>o.id===c.dataset.o).cid)};
  let dragId=null;
  $$('.opp',v).forEach(el=>{el.addEventListener('dragstart',e=>{dragId=el.dataset.o;el.classList.add('dragging');e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',dragId)});el.addEventListener('dragend',()=>el.classList.remove('dragging'))});
  $$('.col',v).forEach(col=>{col.addEventListener('dragover',e=>{e.preventDefault();col.classList.add('over')});col.addEventListener('dragleave',e=>{if(!col.contains(e.relatedTarget))col.classList.remove('over')});col.addEventListener('drop',e=>{e.preventDefault();col.classList.remove('over');const id=e.dataTransfer.getData('text/plain')||dragId;const o=OPPS.find(x=>x.id===id);if(o)setStage(o,col.dataset.col)})});
};
